<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock Screen Clock & Weather</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #e6ffe6; /* Білий з легким зеленим відтінком */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        .time {
            font-size: clamp(4rem, 18vw, 10rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 0 0 20px rgba(0, 255, 128, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Анімація блимання двокрапки: 2 рази на секунду (цикл 0.5с) */
        .colon {
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0.15;
            }
        }

        .date {
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            margin-top: 15px;
            font-weight: 400;
            opacity: 0.9;
            text-transform: capitalize;
        }

        .weather {
            font-size: clamp(1rem, 3.5vw, 1.8rem);
            margin-top: 25px;
            font-weight: 300;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Кнопка повного екрана */
        .fullscreen-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(230, 255, 230, 0.08);
            border: 1px solid rgba(230, 255, 230, 0.2);
            color: #e6ffe6;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            opacity: 0.6;
            z-index: 10;
        }

        .fullscreen-btn:hover {
            opacity: 1;
            background: rgba(230, 255, 230, 0.15);
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .time {
                font-size: clamp(3.5rem, 22vh, 7rem);
            }
            .date {
                margin-top: 8px;
                font-size: clamp(1rem, 5vh, 1.5rem);
            }
            .weather {
                margin-top: 10px;
                font-size: clamp(0.9rem, 4.5vh, 1.3rem);
            }
            .fullscreen-btn {
                bottom: 10px;
                right: 10px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="time" id="time">
            <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span>
        </div>
        <div class="date" id="date">пн, 01 січ. 24</div>
        <div class="weather" id="weather">Визначення локації...</div>
    </div>

    <!-- Кнопка розгортання на весь екран -->
    <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullScreen()">⛶ Повний екран</button>

    <script>
        // --- TIME & DATE (Київський час) ---
        function updateClock() {
            const now = new Date();

            const hoursFormatter = new Intl.DateTimeFormat('uk-UA', {
                timeZone: 'Europe/Kyiv',
                hour: '2-digit',
                hour12: false
            });

            const minutesFormatter = new Intl.DateTimeFormat('uk-UA', {
                timeZone: 'Europe/Kyiv',
                minute: '2-digit'
            });

            document.getElementById('hours').textContent = hoursFormatter.format(now);
            document.getElementById('minutes').textContent = minutesFormatter.format(now);

            const dateFormatter = new Intl.DateTimeFormat('uk-UA', {
                timeZone: 'Europe/Kyiv',
                weekday: 'short',
                day: 'numeric',
                month: 'short',
                year: '2-digit'
            });
            
            let dateString = dateFormatter.format(now).replace(/\./g, '');
            document.getElementById('date').textContent = dateString;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // --- FULLSCREEN HANDLER ---
        function toggleFullScreen() {
            const btn = document.getElementById('fullscreenBtn');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen();
                } else if (docEl.webkitRequestFullscreen) { /* Safari / iOS */
                    docEl.webkitRequestFullscreen();
                }
                btn.textContent = '✕ Згорнути';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                btn.textContent = '⛶ Повний екран';
            }
        }

        // --- WEATHER & GEOLOCATION ---
        const weatherCodeMap = {
            0: "Ясно", 1: "Переважно ясно", 2: "Мінлива хмарність", 3: "Хмарно",
            45: "Туман", 48: "Паморозь", 51: "Мряка", 53: "Помірна мряка",
            55: "Густа мряка", 61: "Невеликий дощ", 63: "Помірний дощ", 65: "Сильний дощ",
            71: "Невеликий сніг", 73: "Помірний сніг", 75: "Сильний сніг",
            80: "Злива", 81: "Сильна злива", 95: "Гроза"
        };

        let currentLat = 50.4501;
        let currentLon = 30.5234;
        let currentCity = "Київ";

        async function fetchCityName(lat, lon) {
            try {
                const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=uk`);
                const geoData = await geoRes.json();
                return geoData.city || geoData.locality || geoData.principalSubdivision || "Погода";
            } catch (e) {
                return "Погода";
            }
        }

        async function fetchWeather(lat, lon, cityName) {
            try {
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`
                );
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;
                const condition = weatherCodeMap[code] || "Погода";

                document.getElementById('weather').textContent = `${cityName} ${temp > 0 ? '+' : ''}${temp}°C, ${condition}`;
            } catch (error) {
                document.getElementById('weather').textContent = "Помилка оновлення погоди";
            }
        }

        async function updateLocationAndWeather() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        currentCity = await fetchCityName(currentLat, currentLon);
                        fetchWeather(currentLat, currentLon, currentCity);
                    },
                    (error) => {
                        fetchWeather(currentLat, currentLon, currentCity);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                fetchWeather(currentLat, currentLon, currentCity);
            }
        }

        updateLocationAndWeather();
        setInterval(updateLocationAndWeather, 15 * 60 * 1000);

        // --- SCREEN WAKE LOCK API ---
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Wake Lock Error: ${err.name}, ${err.message}`);
            }
        }

        requestWakeLock();

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
