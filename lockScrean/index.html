<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock Screen Clock & Weather</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #e6ffe6; /* Білий з легким зеленим відтінком */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        .time {
            font-size: clamp(4rem, 18vw, 10rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 0 0 20px rgba(0, 255, 128, 0.15);
        }

        .date {
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            margin-top: 15px;
            font-weight: 400;
            opacity: 0.9;
            text-transform: capitalize;
        }

        .weather {
            font-size: clamp(1rem, 3.5vw, 1.8rem);
            margin-top: 25px;
            font-weight: 300;
            opacity: 0.85;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .time {
                font-size: clamp(3.5rem, 22vh, 7rem);
            }
            .date {
                margin-top: 8px;
                font-size: clamp(1rem, 5vh, 1.5rem);
            }
            .weather {
                margin-top: 10px;
                font-size: clamp(0.9rem, 4.5vh, 1.3rem);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">пн, 01 січ. 24</div>
        <div class="weather" id="weather">Визначення локації...</div>
    </div>

    <script>
        // --- TIME & DATE (Київський час) ---
        function updateClock() {
            const now = new Date();

            const timeFormatter = new Intl.DateTimeFormat('uk-UA', {
                timeZone: 'Europe/Kyiv',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            document.getElementById('time').textContent = timeFormatter.format(now);

            const dateFormatter = new Intl.DateTimeFormat('uk-UA', {
                timeZone: 'Europe/Kyiv',
                weekday: 'short',
                day: 'numeric',
                month: 'short',
                year: '2-digit'
            });
            
            let dateString = dateFormatter.format(now).replace(/\./g, '');
            document.getElementById('date').textContent = dateString;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // --- WEATHER & GEOLOCATION ---
        const weatherCodeMap = {
            0: "Ясно", 1: "Переважно ясно", 2: "Мінлива хмарність", 3: "Хмарно",
            45: "Туман", 48: "Паморозь", 51: "Мряка", 53: "Помірна мряка",
            55: "Густа мряка", 61: "Невеликий дощ", 63: "Помірний дощ", 65: "Сильний дощ",
            71: "Невеликий сніг", 73: "Помірний сніг", 75: "Сильний сніг",
            80: "Злива", 81: "Сильна злива", 95: "Гроза"
        };

        // Резервні координати за замовчуванням (Київ), якщо геолокація вимкнена/відхилена
        let currentLat = 50.4501;
        let currentLon = 30.5234;
        let currentCity = "Київ";

        async function fetchCityName(lat, lon) {
            try {
                const response = await fetch(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${lat},${lon}&count=1&language=uk`
                );
                // Зворотне геокодування через Open-Meteo Geocoding / BigDataCloud
                const geoRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=uk`);
                const geoData = await geoRes.json();
                
                return geoData.city || geoData.locality || geoData.principalSubdivision || "Погода";
            } catch (e) {
                return "Погода";
            }
        }

        async function fetchWeather(lat, lon, cityName) {
            try {
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`
                );
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;
                const condition = weatherCodeMap[code] || "Погода";

                document.getElementById('weather').textContent = `${cityName} ${temp > 0 ? '+' : ''}${temp}°C, ${condition}`;
            } catch (error) {
                document.getElementById('weather').textContent = "Помилка оновлення погоди";
            }
        }

        async function updateLocationAndWeather() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        currentCity = await fetchCityName(currentLat, currentLon);
                        fetchWeather(currentLat, currentLon, currentCity);
                    },
                    (error) => {
                        console.warn("Геолокацію відхилено або помилка. Використовується дефолтне місто.");
                        fetchWeather(currentLat, currentLon, currentCity);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                fetchWeather(currentLat, currentLon, currentCity);
            }
        }

        // Оновлювати локацію та погоду кожні 15 хвилин
        updateLocationAndWeather();
        setInterval(updateLocationAndWeather, 15 * 60 * 1000);

        // --- SCREEN WAKE LOCK API ---
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Wake Lock Error: ${err.name}, ${err.message}`);
            }
        }

        requestWakeLock();

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
